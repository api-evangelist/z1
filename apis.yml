aid: z1
name: Z1
description: >-
  Z1 is the API Evangelist network profile for the consumer social gaming app
  operated by Bunch Live, Inc., known publicly as Bunch and now rebranded as
  Mini Party (mini.party). The product lets friends hang out, play party games,
  and video chat together in real time on mobile, and connects with external
  services such as Discord. Bunch raised early venture funding (including a
  $3.8M round) and is tracked here as a 500 Global portfolio company. Bunch
  formerly operated a Bunch Developer Platform (the "Party Kit" voice/video SDK
  for iOS, Android, and Unity plus a Party Reservation API), but that developer
  program has been discontinued and the company currently publishes no public
  developer API, OpenAPI, or developer portal — this profile captures its
  identity, legal surface, and domain-security posture only.
